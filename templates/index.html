<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeFi Dashboard</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Design system -->
  <link rel="stylesheet" href="/static/style.css?v={{ static_version }}">

  <!-- React 18 + Babel standalone -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

  <!-- Recharts (charts for Dashboard + Performance) -->
  <script src="https://unpkg.com/recharts@2.10.0/umd/Recharts.min.js"></script>

  <!-- Lightweight Charts (candlestick charts for Scanner) -->
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>

</head>
<body>
  <div id="root"></div>

  <!-- Load order: utils → charts → nav → [screen files] → app (mounts root last) -->
  <script src="/static/utils.js?v={{ static_version }}"></script>
  <script src="/static/charts.js?v={{ static_version }}"></script>

  <script type="text/babel" src="/static/nav.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/portfolio2.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/spotpnl.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/archive.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/marketdata.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/aibrief.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/settings.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/dashboard.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/performance.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/trading.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/quiz.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/concepts.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/validator.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/journal.js?v={{ static_version }}"></script>
  <script type="text/babel" src="/static/app.js?v={{ static_version }}"></script>
</body>
</html>
