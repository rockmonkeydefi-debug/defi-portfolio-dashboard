<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Setup - DeFi Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head><body>
<div class="login-container">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:40px;margin-bottom:8px">🚀</div>
      <div style="color:#e0e0e0;font-size:20px;font-weight:700">Welcome to DeFi Dashboard</div>
      <div style="color:#8892b0;font-size:13px;margin-top:4px">Create a password to secure your dashboard</div>
    </div>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <input type="password" name="password" placeholder="Password (min 6 characters)" autofocus
        class="login-input" required minlength="6">
      <input type="password" name="confirm" placeholder="Confirm password"
        class="login-input" required minlength="6">
      <button type="submit" class="login-btn">Create Password & Enter</button>
    </form>
  </div>
</div>
</body></html>
