<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - DeFi Dashboard</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="stylesheet" href="/static/style.css">
</head><body>
<div class="login-container">
  <div class="login-box">
    <div style="text-align:center;margin-bottom:24px">
      <div style="font-size:40px;margin-bottom:8px">🔐</div>
      <div style="color:#e0e0e0;font-size:20px;font-weight:700">DeFi Dashboard</div>
      <div style="color:#8892b0;font-size:13px;margin-top:4px">Enter your password to continue</div>
    </div>
    {% if error %}
    <div class="login-error">{{ error }}</div>
    {% endif %}
    <form method="POST" action="/login">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <input type="password" name="password" placeholder="Password" autofocus
        class="login-input" required>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>
</div>
</body></html>
